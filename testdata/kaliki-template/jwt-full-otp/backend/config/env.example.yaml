server:
  port: "8080"

database:
  # Overridden by DATABASE_URL in docker-compose.
  url: "postgres://postgres:postgres@localhost:5432/jwt_full_otp_app?sslmode=disable"

observability:
  service_name: "jwt-full-otp-app-backend"
  # OTLP/gRPC collector "host:port" (or OTEL_EXPORTER_OTLP_ENDPOINT). Defaults to
  # the Jaeger in docker-compose.services.yml (UI: http://localhost:16686).
  # Set to "" for the no-op tracer.
  endpoint: "localhost:4317"

token:
  # Overridden by JWT_SECRET in docker-compose. Change this in production.
  secret: "dev-insecure-change-me"
  expiry_hours: 1           # access token TTL (short; clients refresh)
  refresh_expiry_hours: 720 # refresh token TTL (30 days)

rate_limit:
  # Baseline IP-scoped floor applied to every request, independent of (and
  # stacking with) any per-operation x-rate-limit rule declared in the OpenAPI
  # spec. Default OFF: an undeclared blanket limit is a production surprise —
  # per-operation rules in the spec are where real intent is expressed.
  # Overridden by RATE_LIMIT_GLOBAL_* in docker-compose / production.
  global_enabled: false
  global_requests: 100 # steady-state requests per global_window
  global_window: "60s"
  global_burst: 20     # extra capacity on top of the steady rate

mail:
  # provider: smtp | ses | (empty -> log transport; prints emails to stdout).
  provider: "smtp" # local default (-> Mailpit); set MAIL_PROVIDER=ses in production
  sender_address: "no-reply@example.com"
  sender_name: "JWT Full OTP App"
  app_name: "JWT Full OTP App"
  base_url: "http://localhost:8080" # used to build links (token method)
  smtp:
    # Local default points at Mailpit (docker-compose). No auth locally.
    host: "localhost"
    port: 1025
    username: ""
    password: ""
  ses:
    region: "us-east-1" # set via SES_REGION / falls back to AWS default chain
    access_key_id: ""
    secret_access_key: ""

redis:
  # Overridden by REDIS_URL in docker-compose.
  url: "redis://localhost:6379"
