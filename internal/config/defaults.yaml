# Embedded defaults: the kaliki-template conventions (ADR-0006).
# A consumer's architecture.yaml is merged over this file: maps merge key by
# key, scalars and lists replace. Project-specific mappings that are not
# conventions (for example outbox.sql -> events) belong in the consumer's file.
version: 1

# Order of Levels, outermost to innermost. Dependencies point inward only.
# Test-only modules have no Level: they are outside the production graph.
levels: [composition_root, domain, infrastructure, foundation]

go:
  # Directory of the Go module (the one containing go.mod), relative to the
  # project root (the --root flag).
  dir: backend
  # Where Modules live, relative to go.dir. Each immediate child directory of
  # `dir` is one Module; its ID is id_prefix + the directory name.
  roots:
    - dir: internal
      id_prefix: ""
    - dir: cmd
      id_prefix: "cmd/"
  # Packages that belong to a Module but live outside its roots (generated
  # code). `dir` is relative to go.dir; the first path segment below it is
  # {name}. Nested packages below that belong to the same Module.
  generated:
    - dir: gen/api
      module: "{name}"

kinds:
  # Matching uses path.Match against Module IDs.
  composition_root: [server, "cmd/*", migrate]
  foundation: [config, database]
  # Explicit per-Module kind override: {module-id: kind}. Wins over everything.
  overrides: {}

api:
  # OpenAPI specs, relative to the project root. api/services/<name>.yaml makes
  # the Module <name> a Domain.
  specs_dir: api/services
  # The type in a Domain's package whose methods implement its operations
  # (method name = operationId in Go casing).
  implementer: Service

sql:
  # Relative to the project root.
  schema_dir: backend/sql/schema
  queries_dir: backend/sql/queries
  # Query file (without .sql) -> Module ID. By default a file belongs to the
  # Module with the same name.
  query_modules: {}

rules:
  inward_only:
    severity: error
    rationale: >-
      Dependencies point inward only: Composition root, then Domain, then
      Infrastructure, then Foundation. Inner modules are the stable, widely
      shared ones. If one of them imports an outer module, a change in the
      outer module can break everything that relies on the inner one, and
      import cycles become likely.
    fix: >-
      Move the shared code into a module at the inner Level (or into the
      Foundation), or invert the dependency: declare an interface in the inner
      module and let the outer module implement it.
  no_domain_to_domain:
    severity: error
    rationale: >-
      Each Domain is a self-contained vertical slice. When one Domain imports
      another, they can no longer be understood, tested or changed
      independently, and a feature in one starts to hide inside the other.
    fix: >-
      Declare a small interface in the consuming Domain describing only what it
      needs, and have the Composition root wire the other Domain into it.
  no_import_composition_root:
    severity: error
    rationale: >-
      The Composition root wires everything together at startup. If anything
      imports it, wiring code becomes a dependency of business code, which
      creates cycles and makes the dependency direction impossible to reason
      about.
    fix: >-
      Move whatever the importer needs out of the Composition root into a
      Domain, Infrastructure module or Foundation, and import it from there.
  test_only_out_of_prod:
    severity: error
    rationale: >-
      Test-only modules hold support code for tests such as fixtures and
      helpers. Production code that imports them ships test scaffolding in the
      binary, and ties real behaviour to code nobody treats as production.
    fix: >-
      Import the test-only module from _test.go files only. If production code
      needs the helper, move it into a regular Infrastructure module.
  package_doc:
    severity: error
    rationale: >-
      The package doc comment is the Purpose on the Module card. It is the
      first thing a new maintainer or an agent reads about a module, and it is
      cheaper to keep it accurate than to rediscover what the module is for.
    fix: >-
      Add a comment directly above the package clause that begins with
      "Package <name> ..." (or "Command <name> ..." for a main package) and says
      what the module is for.

# Reserved for future metric rules. Accepted but ignored in v1.
thresholds: {}
