<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Architecture Explorer</title>
<style>/*@PALETTE@*/</style>
<style>/*@CSS@*/</style>
</head>
<body>
<header id="top">
  <a id="brand" href="#/" aria-label="System overview"><span class="logo" aria-hidden="true"></span><span><b id="projname">Architecture</b><small>Architecture Explorer</small></span></a>
  <div id="searchwrap">
    <input id="search" type="search" placeholder="Search modules, operations, tables, functions" autocomplete="off" aria-label="Search">
    <kbd id="searchkey" aria-hidden="true">/</kbd>
    <div id="results" hidden></div>
  </div>
  <a id="health" class="pill" href="#/"></a>
  <button id="theme" type="button" aria-label="Switch between light and dark"></button>
</header>
<div id="banner" hidden role="alert"></div>
<div id="page">
  <nav id="crumbs" aria-label="Breadcrumbs"></nav>
  <div id="head"></div>
  <div id="body"></div>
</div>
<script type="application/json" id="archmodel-model">@MODEL_JSON@</script>
<script type="application/json" id="archmodel-config">@CONFIG_JSON@</script>
<!--@DIFF@-->
<script>/*@LIBS@*/</script>
<script>/*@JS@*/</script>
</body>
</html>
